<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Energie Vergelijker NL 2026</title>
  <meta name="description" content="Vergelijk dynamische energieleveranciers op basis van jouw werkelijke verbruik. Inclusief live EPEX prijzen.">

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React + Babel -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { background: #09090b; color: #f4f4f5; font-family: system-ui, sans-serif; }
    input[type=range] { -webkit-appearance: none; appearance: none; }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 16px; height: 16px;
      border-radius: 50%; background: #34d399; cursor: pointer;
      box-shadow: 0 0 0 3px rgba(52,211,153,0.15);
    }
    input[type=range]::-moz-range-thumb {
      width: 16px; height: 16px; border-radius: 50%;
      background: #34d399; cursor: pointer; border: none;
    }
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect, useCallback } = React;

const SUPPLIERS = [
  { id: "nextenergy", name: "NextEnergy",     color: "#10b981", markup: 0.01810, monthly: 4.95, feedin_fee: 0.000,  solar_bonus: 0.50, signup: 223.14, notes: "50% zonnebonus 06–22u (max 6.000 kWh, activeer in app). €270 jaarkorting na 12 mnd." },
  { id: "frank",      name: "Frank Energie",  color: "#f97316", markup: 0.01504, monthly: 5.99, feedin_fee: 0.0182, solar_bonus: 0.15, signup: 0,      notes: "~15% zonnebonus (indicatief, niet contractueel). Slim Laden voor EV." },
  { id: "zonneplan",  name: "Zonneplan",      color: "#eab308", markup: 0.01653, monthly: 5.17, feedin_fee: 0.0165, solar_bonus: 0.10, signup: 0,      notes: "10% zonnebonus. Beste klanttevredenheid 4.6★." },
  { id: "budget",     name: "Budget Energie", color: "#ec4899", markup: 0.01736, monthly: 4.95, feedin_fee: 0.0165, solar_bonus: 0.00, signup: 132.23, notes: "€160 cashback bij zonnepanelen. Grote leverancier (1,2M klanten)." },
  { id: "tibber",     name: "Tibber",         color: "#8b5cf6", markup: 0.02050, monthly: 4.95, feedin_fee: 0.0205, solar_bonus: 0.00, signup: 0,      notes: "Beste app & EV-integratie. Geen inkoopverg. buiten saldeergrens per jan '26." },
  { id: "vandebron",  name: "Vandebron",      color: "#3b82f6", markup: 0.02124, monthly: 5.17, feedin_fee: 0.0165, solar_bonus: 0.00, signup: 99.17,  notes: "Hoogste duurzaamheid (9.6/A). €120 cashback." },
]

const TAX = { elec: 0.11085 / 1.21, gas: 0.72680 / 1.21, reduction: 628.96 / 1.21, vat: 0.21 } // Exact 2026 tarieven Belastingdienst
const GAS_SPOT = 0.45
const NETWORK_ELEC = { "3x25": 505, "1x35": 432, "3x63": 748 }
const NETWORK_GAS = 246
const MEDALS = ["🥇", "🥈", "🥉", "4.", "5.", "6."]
const SOLAR_M = [0.2,0.3,0.6,0.9,1.1,1.2,1.15,1.05,0.75,0.45,0.25,0.15]

function mulberry32(a) {
  return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296 }
}

function generateFallback() {
  const rng = mulberry32(42), out = [], s = new Date("2024-01-01T00:00:00Z")
  for (let i = 0; i < 8760; i++) {
    const t = new Date(s.getTime() + i * 3600000)
    const mo = t.getUTCMonth(), hr = t.getUTCHours(), dw = t.getUTCDay()
    const sF = (mo<=1||mo>=10) ? 1.28 : (mo>=4&&mo<=8) ? 0.88 : 1.05
    const pk = hr>=7 && hr<=22 && dw>=1 && dw<=5
    const md = hr>=11 && hr<=15 && mo>=4 && mo<=8
    const p = rng()<(md?0.03:0.003) ? -(rng()*30+5)
      : Math.max(0.5, 97*sF*(pk?1.22:0.72)*(md?0.55:1)*((dw===0||dw===6)?0.85:1)*(1+(rng()-0.5)*0.3))
    out.push({ hour: t, kwh: p/1000 })
  }
  return out
}
const FALLBACK_PRICES = generateFallback()

function calc(sup, { annual_kwh, feedin_kwh, gas_m3, peak_fraction, solar_self_pct, ev_extra_kwh }, prices) {
  const tk = annual_kwh + ev_extra_kwh
  let tB=0, tS=0
  for (const {hour: hRaw} of prices) {
    const h = hRaw instanceof Date ? hRaw : new Date(hRaw)
    const hr=h.getUTCHours(), dw=h.getUTCDay(), mo=h.getUTCMonth()
    const pk = !(dw===0||dw===6) && hr>=7 && hr<=22
    tB += pk ? peak_fraction/(80*52) : (1-peak_fraction)/((168-80)*52) // 16u*5d=80 piekuur/week
    if (hr>=8&&hr<18) tS += Math.exp(-((hr-13)**2)/12.5)*SOLAR_M[mo]*(1-solar_self_pct)
  }
  const scaleFactor = prices.length >= 8000 ? 1 : 8760 / prices.length
  let vE=0, fR=0, nF=0
  for (const {hour: hRaw, kwh: spot} of prices) {
    const h = hRaw instanceof Date ? hRaw : new Date(hRaw)
    const hr=h.getUTCHours(), mo=h.getUTCMonth(), dw=h.getUTCDay()
    const pk = !(dw===0||dw===6) && hr>=7 && hr<=22
    const bw = pk ? peak_fraction/(80*52) : (1-peak_fraction)/((168-80)*52)
    vE += (bw/tB)*tk*(spot+sup.markup)
    if (feedin_kwh>0 && tS>0 && hr>=8 && hr<18) {
      const sw = Math.exp(-((hr-13)**2)/12.5)*SOLAR_M[mo]*(1-solar_self_pct)
      if (sw>0) {
        const fk=(sw/tS)*feedin_kwh
        if (spot<0) nF+=fk*Math.abs(spot)
        else { let r=spot+sup.feedin_fee; if(hr>=6&&hr<22&&sup.solar_bonus>0) r+=spot*sup.solar_bonus; fR+=fk*r }
      }
    }
  }
  vE *= scaleFactor; fR *= scaleFactor; nF *= scaleFactor
  const fi=sup.monthly*12, ga=gas_m3*GAS_SPOT
  const tx=Math.max(0,tk-feedin_kwh)*TAX.elec+gas_m3*TAX.gas-TAX.reduction
  const total=(vE+fi+ga+tx-fR+nF-sup.signup)*(1+TAX.vat)
  return {
    ...sup, total,
    bd:{ elec:vE*1.21, fixed:fi*1.21, gas:ga*1.21, tax:tx*1.21, feedin:fR*1.21, signup:sup.signup*1.21 },
    bonus:{ rev:fR*1.21, sp:sup.solar_bonus>0?sup.solar_bonus:null, fc:sup.feedin_fee>0?+(sup.feedin_fee*1.21*100).toFixed(1):null, su:sup.signup*1.21 },
  }
}

const eur=(v,d=0)=>"€\u202f"+Math.abs(v).toLocaleString("nl-NL",{minimumFractionDigits:d,maximumFractionDigits:d})

function Slider({ label, value, min, max, step, fmt, onChange, hint }) {
  return (
    <div className="space-y-1">
      <div className="flex justify-between">
        <span className="text-xs text-zinc-400">{label}</span>
        <span className="text-xs font-mono text-zinc-200">{fmt(value)}</span>
      </div>
      <input type="range" min={min} max={max} step={step} value={value}
        onChange={e=>onChange(+e.target.value)}
        className="w-full h-1 rounded-full appearance-none bg-zinc-700 cursor-pointer accent-emerald-400" />
      {hint && <p className="text-xs text-zinc-600 mt-0.5">{hint}</p>}
    </div>
  )
}

function Accordion({ title, icon, children, defaultOpen=false }) {
  const [open, setOpen] = useState(defaultOpen)
  return (
    <div className="border border-zinc-800 rounded-xl overflow-hidden">
      <button onClick={()=>setOpen(v=>!v)} className="w-full flex items-center justify-between px-4 py-3 bg-zinc-900 active:bg-zinc-800 transition-colors">
        <div className="flex items-center gap-2">
          <span>{icon}</span>
          <span className="text-xs font-mono tracking-widest text-emerald-400 uppercase">{title}</span>
        </div>
        <span className={`text-zinc-500 text-xs transition-transform duration-200 ${open?"rotate-180":""}`}>▼</span>
      </button>
      {open && <div className="bg-zinc-900 border-t border-zinc-800 p-4 space-y-4">{children}</div>}
    </div>
  )
}

function Toggle({ on, onToggle }) {
  return (
    <button onClick={onToggle} className={`w-10 h-6 rounded-full relative transition-colors shrink-0 ${on?"bg-emerald-500":"bg-zinc-700"}`}>
      <span className={`absolute top-1 w-4 h-4 rounded-full bg-white shadow transition-all duration-200 ${on?"left-5":"left-1"}`} />
    </button>
  )
}

function Bar({ label, value, max, color, rev }) {
  return (
    <div className="flex items-center gap-2">
      <span className="text-xs text-zinc-400 w-32 shrink-0">{label}</span>
      <div className="flex-1 h-1.5 bg-zinc-800 rounded-full overflow-hidden">
        <div className="h-full rounded-full transition-all" style={{width:`${Math.min(100,Math.abs(value)/max*100)}%`,background:color}} />
      </div>
      <span className={`text-xs font-mono w-16 text-right shrink-0 ${rev?"text-emerald-400":"text-zinc-300"}`}>
        {rev?"-":""}{eur(Math.abs(value))}
      </span>
    </div>
  )
}

function App() {
  const [kwh, setKwh]     = useState(8732)
  const [feedin, setFi]   = useState(1231)
  const [gas, setGas]     = useState(1154)
  const [peak, setPeak]   = useState(40)
  const [self, setSelf]   = useState(30)
  const [evOn, setEvOn]   = useState(false)
  const [evKwh, setEvKwh] = useState(4000)
  const [net, setNet]     = useState("3x25")
  const [prov, setProv]   = useState("Energiedirect")
  const [cS, setCS]       = useState(1890)
  const [cG, setCG]       = useState(1897)
  const [cT, setCT]       = useState(232)
  const [expanded, setEx] = useState(null)
  const [prices, setPrices]     = useState(FALLBACK_PRICES)
  const [priceSource, setSrc]   = useState("synthetisch")
  const [priceTime, setPriceTime] = useState(null)
  const [loading, setLoading]   = useState(true)

  const fetchPrices = useCallback(async () => {
    setLoading(true)
    try {
      const live = await fetchLivePrices()
      setPrices(live)
      setSrc("Live EPEX · Fraunhofer ISE")
      setPriceTime(new Date())
    } catch(e) {
      console.warn("Live prijzen niet beschikbaar, synthetisch gebruikt:", e.message)
      setPrices(FALLBACK_PRICES)
      setSrc("synthetisch (pessimistisch)")
      setPriceTime(new Date())
    }
    setLoading(false)
  }, [])

  useEffect(() => {
    fetchPrices()
    const iv = setInterval(fetchPrices, 3600000) // elk uur
    return () => clearInterval(iv)
  }, [fetchPrices])

  // Refresh om 14:30 voor next-day EPEX prijzen
  useEffect(() => {
    const now = new Date(), pub = new Date(now)
    pub.setHours(14, 30, 0, 0)
    const ms = pub - now
    if (ms > 0) { const t = setTimeout(fetchPrices, ms); return () => clearTimeout(t) }
  }, [fetchPrices])

  const nb = (NETWORK_ELEC[net]||505)+NETWORK_GAS
  const profile = {annual_kwh:kwh,feedin_kwh:feedin,gas_m3:gas,peak_fraction:peak/100,solar_self_pct:self/100,ev_extra_kwh:evOn?evKwh:0}
  const results = useMemo(()=>SUPPLIERS.map(s=>calc(s,profile,prices)).sort((a,b)=>a.total-b.total),[kwh,feedin,gas,peak,self,evOn,evKwh,prices])

  const win = results[0]
  const wt = win.total+nb
  const ct = cS+cG
  const bp = ct-cT*12
  const sav = ct-wt
  const mx = Math.max(win.bd.elec, win.bd.gas, win.bd.tax, nb)

  return (
    <div className="min-h-screen bg-zinc-950 text-zinc-100" style={{fontFamily:"system-ui,sans-serif",fontSize:"14px"}}>

      {/* Sticky header */}
      <header className="sticky top-0 z-20 bg-zinc-950/95 backdrop-blur border-b border-zinc-800 px-4 py-3 flex items-center justify-between">
        <div className="flex items-center gap-2.5">
          <div className="w-7 h-7 rounded-lg bg-gradient-to-br from-emerald-400 to-teal-600 flex items-center justify-center text-sm shrink-0">⚡</div>
          <div>
            <p className="text-sm font-semibold leading-none">Energie Vergelijker NL</p>
            <p className="text-xs text-zinc-500">2026 · pessimistisch scenario</p>
          </div>
        </div>
        <div className="flex items-center gap-2">
          {loading ? (
            <span className="text-xs text-zinc-500 animate-pulse">laden…</span>
          ) : (
            <span className={`text-xs px-2 py-0.5 rounded-full border flex items-center gap-1.5 ${priceSource.includes("EPEX") ? "border-emerald-500/30 bg-emerald-500/5 text-emerald-400" : "border-zinc-700 text-zinc-500"}`}>
              <span className={`w-1.5 h-1.5 rounded-full inline-block ${priceSource.includes("EPEX") ? "bg-emerald-400 animate-pulse" : "bg-zinc-600"}`}/>
              {priceSource.includes("EPEX") ? `Live EPEX · ${prices.length}u` : "Synthetisch"}
            </span>
          )}
          <button onClick={fetchPrices} className="text-zinc-600 hover:text-zinc-300 text-base px-1 transition-colors">↻</button>
        </div>
      </header>

      <div className="px-4 py-4 space-y-4 pb-12 max-w-xl mx-auto">

        {/* Winner */}
        <div className="rounded-2xl border border-emerald-500/20 bg-emerald-500/5 p-4 space-y-3">
          <div className="flex items-start gap-3">
            <span className="text-3xl leading-none mt-0.5">🥇</span>
            <div className="flex-1 min-w-0">
              <p className="text-lg font-bold text-emerald-400 leading-none">{win.name}</p>
              <p className="text-sm text-zinc-400 mt-1">{eur(wt)}<span className="text-zinc-600">/jaar</span> · {eur(wt/12)}<span className="text-zinc-600">/mnd</span></p>
              <p className="text-xs text-zinc-600 mt-0.5">incl. Stedin netbeheer</p>
            </div>
            {sav>50 && (
              <div className="text-right shrink-0">
                <p className="text-xs text-zinc-500">vs {prov||"huidig"}</p>
                <p className="text-xl font-mono font-bold text-emerald-400 leading-none">{eur(sav)}</p>
                <p className="text-xs text-zinc-500">besparing/jaar</p>
              </div>
            )}
          </div>
          <p className="text-xs text-zinc-500 leading-relaxed border-t border-zinc-800 pt-3">{win.notes}</p>
        </div>

        {/* Rankings — tap to expand */}
        <div className="rounded-xl border border-zinc-800 bg-zinc-900 overflow-hidden">
          <div className="px-4 py-2.5 border-b border-zinc-800 flex items-center justify-between">
            <p className="text-xs font-mono tracking-widest text-emerald-400 uppercase">Ranglijst</p>
            <p className="text-xs text-zinc-600">tik voor details</p>
          </div>
          <div className="divide-y divide-zinc-800/50">
            {results.map((r,i) => {
              const tot=r.total+nb, isOpen=expanded===r.id
              return (
                <div key={r.id}>
                  <button onClick={()=>setEx(isOpen?null:r.id)}
                    className={`w-full flex items-center gap-3 px-4 py-3.5 text-left active:bg-zinc-800/50 transition-colors ${i===0?"bg-emerald-950/25":""}`}>
                    <span className="text-sm text-zinc-500 w-5 shrink-0 text-center">{MEDALS[i]}</span>
                    <span className="w-2.5 h-2.5 rounded-full shrink-0" style={{background:r.color}}/>
                    <span className={`flex-1 text-sm font-medium ${i===0?"text-emerald-400":"text-zinc-100"}`}>{r.name}</span>
                    <div className="text-right shrink-0">
                      <p className={`text-sm font-mono font-bold ${i===0?"text-emerald-400":"text-zinc-200"}`}>{eur(tot)}</p>
                      <p className="text-xs text-zinc-500">{eur(tot/12)}/mnd</p>
                    </div>
                    <span className={`text-zinc-600 text-xs ml-1 transition-transform duration-200 ${isOpen?"rotate-180":""}`}>▼</span>
                  </button>
                  {isOpen && (
                    <div className="px-4 pt-2 pb-4 bg-zinc-900/60 border-t border-zinc-800/40 space-y-3">
                      <div className="flex flex-wrap gap-1.5">
                        <span className="text-xs bg-emerald-950 text-emerald-400 rounded-full px-2.5 py-1">✓ -{eur(r.bonus.rev)}/j teruglevering</span>
                        {r.bonus.sp && <span className="text-xs bg-emerald-950 text-emerald-400 rounded-full px-2.5 py-1">✓ +{(r.bonus.sp*100).toFixed(0)}% zonnebonus</span>}
                        {r.bonus.fc && <span className="text-xs bg-emerald-950 text-emerald-400 rounded-full px-2.5 py-1">✓ +{r.bonus.fc}ct inkoop</span>}
                        {r.bonus.su>0 && <span className="text-xs bg-emerald-950 text-emerald-400 rounded-full px-2.5 py-1">✓ -{eur(r.bonus.su)} welkomst</span>}
                      </div>
                      {i>0 && <p className="text-xs text-red-400">+{eur(tot-wt)} duurder dan {win.name}</p>}
                      <p className="text-xs text-zinc-500 leading-relaxed">{r.notes}</p>
                    </div>
                  )}
                </div>
              )
            })}
            {/* Huidig */}
            <div className="flex items-center gap-3 px-4 py-3.5 opacity-40">
              <span className="text-xs text-zinc-600 w-5 text-center">nu</span>
              <span className="w-2.5 h-2.5 rounded-full bg-zinc-600 shrink-0"/>
              <span className="flex-1 text-sm text-zinc-400">{prov||"Huidig"}</span>
              <div className="text-right shrink-0">
                <p className="text-sm font-mono text-zinc-400">{eur(ct)}</p>
                <p className="text-xs text-zinc-600">{eur(ct/12)}/mnd</p>
              </div>
              <span className="text-xs font-mono bg-red-500/10 text-red-400 px-2 py-0.5 rounded-full ml-1 shrink-0">+{eur(ct-wt)}</span>
            </div>
          </div>
        </div>

        {/* Kostenopbouw */}
        <div className="rounded-xl border border-zinc-800 bg-zinc-900 p-4 space-y-3">
          <p className="text-xs font-mono tracking-widest text-emerald-400 uppercase">Kostenopbouw — {win.name}</p>
          <Bar label="Stroom variabel"   value={win.bd.elec}   max={mx} color="#6366f1" />
          <Bar label="Vaste kosten"      value={win.bd.fixed}  max={mx} color="#8b5cf6" />
          <Bar label="Gas"               value={win.bd.gas}    max={mx} color="#f59e0b" />
          <Bar label="Belasting (netto)" value={win.bd.tax}    max={mx} color="#6b7280" />
          <Bar label="Netbeheer"         value={nb}            max={mx} color="#f97316" />
          <Bar label="Teruglevering"     value={win.bd.feedin} max={mx} color="#10b981" rev />
          {win.bd.signup>0 && <Bar label="Welkomstbonus" value={win.bd.signup} max={mx} color="#10b981" rev />}
          <div className="flex justify-between items-center border-t border-zinc-800 pt-3">
            <span className="text-sm text-zinc-300 font-medium">Totaal</span>
            <span className="text-base font-mono font-bold text-emerald-400">{eur(wt)}</span>
          </div>
        </div>

        {/* Settings accordions */}
        <Accordion title="Jouw verbruik" icon="📊" defaultOpen>
          <Slider label="Stroom totaal (incl. EV)" value={kwh} min={1000} max={15000} step={100} fmt={v=>`${v.toLocaleString("nl-NL")} kWh`} onChange={setKwh}/>
          <Slider label="Solar teruglevering" value={feedin} min={0} max={6000} step={50} fmt={v=>`${v.toLocaleString("nl-NL")} kWh`} onChange={setFi}/>
          <Slider label="Gasverbruik" value={gas} min={0} max={3000} step={50} fmt={v=>`${v.toLocaleString("nl-NL")} m³`} onChange={setGas}/>
          <Slider label="Piekverbruik" value={peak} min={20} max={80} step={5} fmt={v=>`${v}% piek · ${100-v}% dal`} onChange={setPeak}/>
          <Slider label="Solar zelfgebruik" value={self} min={0} max={90} step={10} fmt={v=>`${v}%`} onChange={setSelf}/>
        </Accordion>

        <Accordion title="EV laden" icon="🔌">
          <div className="flex items-center justify-between">
            <div>
              <p className="text-sm text-zinc-200">EV apart optellen</p>
              <p className="text-xs text-zinc-500 mt-0.5">Alleen aan als EV niet al in stroomverbruik zit</p>
            </div>
            <Toggle on={evOn} onToggle={()=>setEvOn(v=>!v)}/>
          </div>
          {evOn && <Slider label="EV kWh/jaar" value={evKwh} min={500} max={8000} step={100} fmt={v=>`${v.toLocaleString("nl-NL")} kWh`} onChange={setEvKwh} hint="Alleen aan als EV niet al in stroomverbruik zit"/>}
        </Accordion>

        <Accordion title="Netbeheer Stedin 2026" icon="🔧">
          <p className="text-xs text-zinc-400">Aansluittype</p>
          <div className="grid grid-cols-3 gap-2">
            {[["3x25","3x25A","nieuwbouw/EV"],["1x35","1x35A","oudere woning"],["3x63","3x63A","zwaar"]].map(([v,l,s])=>(
              <button key={v} onClick={()=>setNet(v)}
                className={`rounded-xl p-3 text-center border transition-colors ${net===v?"border-emerald-500 bg-emerald-950":"border-zinc-700 bg-zinc-800 active:bg-zinc-700"}`}>
                <p className={`text-xs font-mono font-bold ${net===v?"text-emerald-400":"text-zinc-300"}`}>{l}</p>
                <p className="text-xs text-zinc-500 mt-0.5">{s}</p>
              </button>
            ))}
          </div>
          <div className="grid grid-cols-3 gap-2 text-center text-xs">
            <div className="bg-zinc-800 rounded-xl p-3"><p className="text-zinc-500">Stroom</p><p className="font-mono text-zinc-200 mt-1">{eur(NETWORK_ELEC[net])}/j</p></div>
            <div className="bg-zinc-800 rounded-xl p-3"><p className="text-zinc-500">Gas</p><p className="font-mono text-zinc-200 mt-1">{eur(NETWORK_GAS)}/j</p></div>
            <div className="bg-zinc-800 rounded-xl p-3"><p className="text-zinc-500">Totaal</p><p className="font-mono text-amber-400 mt-1">{eur(nb)}/j</p></div>
          </div>
        </Accordion>

        <Accordion title="Huidig contract" icon="📄">
          <div className="space-y-1.5">
            <p className="text-xs text-zinc-400">Huidige provider</p>
            <input type="text" value={prov} onChange={e=>setProv(e.target.value)} placeholder="bijv. Energiedirect"
              className="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-2.5 text-sm text-zinc-200 placeholder-zinc-600"/>
          </div>
          <Slider label="Jaarrekening stroom" value={cS} min={200} max={4000} step={10} fmt={eur} onChange={setCS}/>
          <Slider label="Jaarrekening gas" value={cG} min={200} max={4000} step={10} fmt={eur} onChange={setCG}/>
          <Slider label="Termijnbedrag / maand" value={cT} min={50} max={600} step={5} fmt={v=>`${eur(v)}/mnd`} onChange={setCT}/>
          <div className="rounded-xl bg-zinc-800 p-3.5 space-y-2 text-sm">
            <div className="flex justify-between text-zinc-400"><span>Jaarrekening</span><span className="font-mono text-zinc-200">{eur(ct)}</span></div>
            <div className="flex justify-between text-zinc-400"><span>Termijn betaald</span><span className="font-mono text-zinc-200">{eur(cT*12)}</span></div>
            <div className={`flex justify-between font-bold border-t border-zinc-700 pt-2 ${bp>50?"text-red-400":bp<-50?"text-emerald-400":"text-zinc-300"}`}>
              <span>{bp>50?"↑ Bijbetaling":bp<-50?"↓ Teruggave":"✓ Klopte"}</span>
              <span className="font-mono">{eur(Math.abs(bp))}</span>
            </div>
          </div>
        </Accordion>

        <p className="text-xs text-zinc-700 text-center leading-relaxed">
          Pessimistisch scenario — werkelijke kosten vallen waarschijnlijk lager uit.<br/>
          Netbeheer Stedin 2026 ACM-vastgesteld · EB €0,1108/kWh · €0,7268/m³ · vermindering €628,96.<br/>
          NextEnergy zonnebonus handmatig activeren in app · Frank solar bonus indicatief.
        </p>

      </div>
    </div>
  )
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
